<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>许秋容 Portfolio · 临时预览</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#261f1d;color:#eee9df;font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}
    body{overflow:hidden}
    .notice{height:30px;display:flex;align-items:center;justify-content:center;padding:0 12px;background:#4a2028;font-size:10px;letter-spacing:.08em}
    iframe{display:block;width:100%;height:calc(100% - 30px);border:0;background:#eee9df}
    .expired{display:none;width:100%;height:100%;place-items:center;padding:28px;text-align:center;background:#261f1d}
    .expired div{max-width:520px}
    .expired b{display:block;margin-bottom:18px;font:italic 400 clamp(42px,12vw,76px)/1 Georgia,serif;color:#eee9df}
    .expired p{margin:0;color:rgba(238,233,223,.72);font-size:14px;line-height:1.8}
    body.is-expired .notice,body.is-expired iframe{display:none}
    body.is-expired .expired{display:grid}
  </style>
</head>
<body>
  <div class="notice">临时预览 · <span id="countdown">10:00</span> 后失效</div>
  <iframe src="playful.html?v=5b65598" title="许秋容个人作品集"></iframe>
  <main class="expired"><div><b>EXPIRED</b><p>该临时分享链接已失效。<br>如需继续查看，请联系分享者重新获取。</p></div></main>
  <script>
    const expiresAt = Date.parse('2026-08-24T09:08:00Z');
    const countdown = document.getElementById('countdown');
    const update = () => {
      const remaining = expiresAt - Date.now();
      if (remaining <= 0) {
        document.body.classList.add('is-expired');
        clearInterval(timer);
        return;
      }
      const seconds = Math.ceil(remaining / 1000);
      countdown.textContent = `${String(Math.floor(seconds / 60)).padStart(2,'0')}:${String(seconds % 60).padStart(2,'0')}`;
    };
    const timer = setInterval(update, 1000);
    update();
  </script>
</body>
</html>
